services:
  pocketbase:
    image: ghcr.io/jkwhar/repairtracker-pocketbase:main
    container_name: repairtracker-pocketbase
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - pb_data:/pb/pb_data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8090/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    image: ghcr.io/jkwhar/repairtracker-frontend:main
    container_name: repairtracker-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      pocketbase:
        condition: service_healthy

volumes:
  pb_data:
